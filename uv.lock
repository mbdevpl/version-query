    { name = "flake518" },
]
mypy = [
    { name = "mypy" },
    { name = "types-setuptools" },
]
publish = [
    { name = "build" },
    { name = "twine" },
]
pydocstyle = [
    { name = "pydocstyle" },
]
pylint = [
    { name = "pylint" },
]
test = [
    { name = "boilerplates", extra = ["git-repo-tests", "packaging-tests"] },
    { name = "codecov" },
    { name = "coverage" },
]

[package.metadata]
requires-dist = [
    { name = "boilerplates", extras = ["cli", "logging"], specifier = "~=1.2" },
    { name = "gitpython", specifier = "~=3.1" },
    { name = "packaging", specifier = ">=24.0" },
    { name = "semver", specifier = ">=2.13,<3.2" },
]

[package.metadata.requires-dev]
flake518 = [{ name = "flake518", specifier = "~=1.6" }]
mypy = [
    { name = "mypy", specifier = "~=2.4" },
    { name = "types-setuptools", specifier = ">=67.4" },
]
publish = [
    { name = "build", specifier = "~=1.6" },
    { name = "twine", specifier = "~=7.0" },
]
pydocstyle = [{ name = "pydocstyle", specifier = "~=6.3" }]
pylint = [{ name = "pylint", specifier = "~=4.1" }]
test = [
    { name = "boilerplates", extras = ["git-repo-tests", "packaging-tests"], specifier = "~=1.2" },
    { name = "codecov", specifier = "~=2.1" },
    { name = "coverage", specifier = "~=7.2" },
]

