name: publish

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  publish-pypi:
    name: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.14'
      - run: uv sync --no-install-workspace --only-group publish
      - run: uv run -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
