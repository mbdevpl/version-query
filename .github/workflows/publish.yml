name: publish

on:
  push:
    tags:
      - v*

jobs:
  publish-github-release:
    name: github release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.15'
      - run: uv sync --no-install-workspace --only-group publish
      - run: uv run -m build
      - uses: softprops/action-gh-release@v3.0.4
        with:
          prerelease: ${{ contains(github.ref, '.dev') || contains(github.ref, 'rc') }}
          files: |
            dist/*.tar.gz
            dist/*.whl
          generate_release_notes: true
  publish-pypi:
    name: pypi
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.15'
      - run: uv sync --no-install-workspace --only-group publish
      - run: uv run -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
